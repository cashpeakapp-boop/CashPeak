name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Create Android project files
        run: flutter create .
        
      - name: Set Android minimum SDK
        run: sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
        
      - name: Add AdMob App ID
        run: |
              python3 - <<'PY'
              from pathlib import Path

              p = Path("android/app/src/main/AndroidManifest.xml")
              s = p.read_text()

              meta = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3600725386955734~3134884048"/>'

          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              s = s.replace("<application", "<application\n" + meta, 1)

              p.write_text(s)
              PY

              echo "Checking AdMob App ID:"
              grep -n "APPLICATION_ID" android/app/src/main/AndroidManifest.xml
          
      - name: Remove default Flutter test
        run: rm -rf test
  
      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cashpeak-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
