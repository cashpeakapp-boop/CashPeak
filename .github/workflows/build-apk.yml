name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Create Android project files
        run:  flutter create . --platforms=android

            - name: Add AdMob App ID
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          admob_meta = '''        <meta-data
              android:name="com.google.android.gms.ads.APPLICATION_ID"
              android:value="ca-app-pub-3600725386955734~313484048"/>'''

          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              text = text.replace(
                  "<application",
                  "<application\n" + admob_meta,
                  1
              )

          manifest.write_text(text)
          PY
      - name: Remove default Flutter test
        run: rm -rf test
  
      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cashpeak-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
