name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Create Android project
        run: flutter create .

      - name: Copy Firebase configuration
        run: |
          mkdir -p android/app
          cp "google-services.json" android/app/google-services.json

      - name: Configure Android Gradle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/settings.gradle.kts")
          text = root.read_text()

          if 'com.google.gms.google-services' not in text:
              text = text.replace(
                  'plugins {',
                  'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                  1
              )
              root.write_text(text)

          app = Path("android/app/build.gradle.kts")
          text = app.read_text()

          if 'com.google.gms.google-services' not in text:
              text = text.replace(
                  'plugins {',
                  'plugins {\n    id("com.google.gms.google-services")',
                  1
              )

          text = text.replace(
              'minSdk = flutter.minSdkVersion',
              'minSdk = 23'
          )

          app.write_text(text)

          print("Android Gradle configured.")

      - name: Add Firebase dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path("pubspec.yaml")
          text = pubspec.read_text()

          additions = {
              "firebase_core": "^4.0.0",
              "firebase_auth": "^6.0.0",
              "cloud_firestore": "^6.0.0",
              "google_sign_in": "^7.1.1",
          }

          if "dependencies:" not in text:
              raise SystemExit("dependencies section not found")

          lines = text.splitlines()
          output = []
          inserted = False

          for line in lines:
              output.append(line)

              if line.strip() == "dependencies:" and not inserted:
                  for name, version in additions.items():
                      output.append(f"  {name}: {version}")
                  inserted = True

          pubspec.write_text("\n".join(output) + "\n")

          print("Firebase dependencies added.")
          PY

      - name: Add AdMob App ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          app_id = "ca-app-pub-3600725386955734~3134884048"

          meta = (
              '        <meta-data '
              'android:name="com.google.android.gms.ads.APPLICATION_ID" '
              f'android:value="{app_id}"/>'
          )

          pattern = r'<meta-data[^>]*android:name="com\.google\.android\.gms\.ads\.APPLICATION_ID"[^>]*/>'

          if re.search(pattern, text):
              text = re.sub(pattern, meta, text, count=1)
          else:
              text = re.sub(
                  r'(<application\b[^>]*>)',
                  r'\1\n' + meta,
                  text,
                  count=1
              )

          manifest.write_text(text)

          print("AdMob App ID added.")
          PY

      - name: Verify Firebase configuration
        run: |
          test -f android/app/google-services.json
          echo "Firebase configuration found."

      - name: Verify AdMob App ID
        run: |
          grep -n "com.google.android.gms.ads.APPLICATION_ID" \
            android/app/src/main/AndroidManifest.xml

      - name: Remove default Flutter test
        run: rm -rf test

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cashpeak-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
