name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Create Android project files
        run: flutter create .

      - name: Set Android minimum SDK and NDK
        shell: bash
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          sed -i '/^android {/a\    ndkVersion = "27.0.12077973"' android/app/build.gradle.kts

      - name: Add AdMob App ID
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          app_id = "ca-app-pub-3600725386955734~3134884048"

          meta = (
              '        <meta-data '
              'android:name="com.google.android.gms.ads.APPLICATION_ID" '
              f'android:value="{app_id}"/>'
          )

          if "com.google.android.gms.ads.APPLICATION_ID" in text:
              text = re.sub(
                  r'\s*<meta-data[^>]*com\.google\.android\.gms\.ads\.APPLICATION_ID[^>]*/>',
                  "\n" + meta,
                  text,
                  count=1,
              )
          else:
              text = re.sub(
                  r'(<application\b[^>]*>)',
                  r'\1\n' + meta,
                  text,
                  count=1,
              )

          manifest.write_text(text)
          PY

      - name: Verify AdMob App ID
        run: |
          grep -n "com.google.android.gms.ads.APPLICATION_ID"             android/app/src/main/AndroidManifest.xml

      - name: Remove default Flutter test
        run: rm -rf test

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cashpeak-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
